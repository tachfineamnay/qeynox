# Docker isolation is not sufficient evidence of native-tool confinement.
services:
  qeynox-hermes:
    image: nousresearch/hermes-agent:v2026.8.3
    command: gateway run
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    expose: ['8642']
    environment:
      HERMES_HOME: /opt/data
      # Hardening ready to apply, NOT applied here: the mount source must exist on the host
      # before docker compose renders the bind mount. Proven config: hermes-config.yaml.
      # HERMES_CONFIG: /etc/hermes/config.yaml
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: '8642'
      API_SERVER_KEY: ${HERMES_API_KEY:?required}
      HERMES_ENABLE_PROJECT_PLUGINS: 'false'
      HERMES_DASHBOARD: '0'
      HERMES_REDACT_SECRETS: 'true'
    volumes:
      - 'hermes-home:/opt/data'
      # - './etc/hermes/config.yaml:/etc/hermes/config.yaml:ro'
    networks:
      coolify:
        aliases: [qeynox-hermes]
    security_opt: ['no-new-privileges:true']
    # The image starts as root and its s6-overlay bootstrap needs exactly these
    # four capabilities; every other capability stays dropped and privileged is
    # never used. Reproduced on the pinned image (local container, same compose
    # settings):
    #   SETGID / SETUID   s6-applyuidgid + s6-setuidgid drop root to hermes
    #                     (without SETGID: "unable to set supplementary group list")
    #   CHOWN             stage2 chowns the data volume and the supervise trees
    #   DAC_OVERRIDE      /opt/data is 0700 hermes:hermes and /run/service is
    #                     hermes-owned, so a root that lost this capability can
    #                     neither enter the volume ("cd: can't cd to /opt/data")
    #                     nor create supervise locks ("unable to control /run/service")
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      options: {max-size: '10m', max-file: '3'}
volumes:
  hermes-home:
networks:
  coolify:
    external: true
