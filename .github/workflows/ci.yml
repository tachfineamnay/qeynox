name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: runtime import
        run: pip install requests
      - name: syntax
        run: python -m compileall -q engine tools web scripts mcp_server.py qeynox.py
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: secret guard
        run: python scripts/secret_guard.py
