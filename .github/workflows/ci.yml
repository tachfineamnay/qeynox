name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r tools/requirements.txt pytest ruff
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  v2-domain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qeynox
          POSTGRES_PASSWORD: qeynox
          POSTGRES_DB: qeynox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qeynox -d qeynox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QEYNOX_TEST_DATABASE_URL: postgresql://qeynox:qeynox@127.0.0.1:5432/qeynox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests pytest ruff -r requirements-core.txt
      - name: Syntax
        run: python -m compileall -q engine tools web scripts core mcp_server.py qeynox.py
      - name: Tests
        run: pytest -q
      - name: Secret guard
        run: python scripts/secret_guard.py
